<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Loan Eligibility Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<main class="wrap">
  <header>
    <h1>AI Loan Eligibility Checker</h1>
    <p>Check eligibility, analyze your credit score, plan EMIs and get AI financial tips in one place.</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="loan">Loan Eligibility</button>
    <button class="tab" data-tab="credit">Credit Score</button>
    <button class="tab" data-tab="emi">EMI Calculator</button>
    <button class="tab" data-tab="tips">AI Financial Tips</button>
  </nav>

  <section id="loan" class="panel glass active">
    <h2>Loan Eligibility Checker</h2>
    <div class="grid">
      <label>Full name<input id="l-name" type="text" placeholder="Asha Patil"></label>
      <label>Email<input id="l-email" type="email" placeholder="asha@example.com"></label>
      <label>Monthly income (₹)<input id="l-income" type="number" min="0"></label>
      <label>Existing monthly EMIs (₹)<input id="l-emis" type="number" min="0" value="0"></label>
      <label>Credit score (300–900)<input id="l-score" type="number" min="300" max="900"></label>
      <label>Loan amount wanted (₹)<input id="l-amount" type="number" min="0"></label>
      <label>Tenure (years)<input id="l-years" type="number" min="1" max="30" value="5"></label>
      <label>Interest rate (% p.a.)<input id="l-rate" type="number" step="0.1" value="10.5"></label>
    </div>
    <button class="btn" id="l-go">Check eligibility</button>
    <div id="l-out" class="out"></div>
  </section>

  <section id="credit" class="panel glass">
    <h2>Credit Score Analyzer</h2>
    <div class="grid">
      <label>Credit score (300–900)<input id="c-score" type="number" min="300" max="900"></label>
      <label>Credit utilization (%)<input id="c-util" type="number" min="0" max="100"></label>
      <label>Missed payments (last 2 years)<input id="c-miss" type="number" min="0" value="0"></label>
      <label>Credit history (years)<input id="c-age" type="number" min="0" step="0.5"></label>
      <label>Hard enquiries (last 6 months)<input id="c-enq" type="number" min="0" value="0"></label>
    </div>
    <button class="btn" id="c-go">Analyze score</button>
    <div id="c-out" class="out"></div>
  </section>

  <section id="emi" class="panel glass">
    <h2>EMI Calculator</h2>
    <div class="grid">
      <label>Loan amount (₹)<input id="e-p" type="number" min="0" value="500000"></label>
      <label>Interest rate (% p.a.)<input id="e-r" type="number" step="0.1" value="10.5"></label>
      <label>Tenure (years)<input id="e-y" type="number" min="1" max="30" value="5"></label>
    </div>
    <button class="btn" id="e-go">Calculate EMI</button>
    <div id="e-out" class="out"></div>
  </section>

  <section id="tips" class="panel glass">
    <h2>AI Financial Tips</h2>
    <label>What would you like advice on?
      <textarea id="t-q" rows="3" placeholder="e.g. How can I raise my credit score before applying for a home loan?"></textarea>
    </label>
    <button class="btn" id="t-go">Get tips</button>
    <div id="t-out" class="out"></div>
  </section>

  <footer>Guidance only, not financial advice. Confirm terms with your lender.</footer>
</main>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
